[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Must match jetdiff exactly, so jetdiff-ui views can be embedded as panes later.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
